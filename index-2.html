<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YBO League</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--cd:#fff;--tx:#141a24;--mu:#667085;--ln:#e4e7ec;--ac:#1d4ed8;--a2:#e6edfd;--ok:#15803d;--no:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1218;--cd:#171c26;--tx:#eef1f6;--mu:#98a2b3;--ln:#283040;--ac:#6ea0ff;--a2:#1d2842;--ok:#4ade80;--no:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1218;--cd:#171c26;--tx:#eef1f6;--mu:#98a2b3;--ln:#283040;--ac:#6ea0ff;--a2:#1d2842;--ok:#4ade80;--no:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{max-width:880px;margin:0 auto;padding:14px 12px 40px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h1{font-size:22px;margin:0;letter-spacing:-.5px}.hd small{color:var(--mu)}
.bd{margin-left:auto;font-size:12px;background:var(--a2);color:var(--ac);padding:3px 9px;border-radius:99px;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
button,select,input{font:inherit;color:var(--tx)}
nav button,.chip{border:1px solid var(--ln);background:var(--cd);padding:7px 13px;border-radius:99px;white-space:nowrap;cursor:pointer}
nav button.on,.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.cd h2{font-size:15px;margin:0 0 8px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:500;font-size:12px}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
tr:last-child td{border-bottom:0}
.tn{display:flex;align-items:center;gap:8px;font-weight:600}
.lg{width:var(--s,28px);height:var(--s,28px);border-radius:50%;background:var(--a2);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:cover}
.fm{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fm label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.fm input,.fm select,select{border:1px solid var(--ln);background:var(--bg);border-radius:9px;padding:8px 9px;min-width:0}
.fm input[type=number]{width:74px}.fm input[type=text]{width:130px}
.bt{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
.bt.g{background:var(--a2);color:var(--ac)}.bt.r{background:transparent;color:var(--no);border:1px solid var(--ln)}
.bt.s{padding:5px 10px;font-size:13px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:8px}
.tc .r{display:flex;gap:6px;flex-wrap:wrap}
.gm{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.gm:last-child{border:0}.gm .d{color:var(--mu);font-size:12px;width:62px;flex:none}
.gm .t{flex:1;display:flex;align-items:center;gap:6px;min-width:0}.gm .t.h{justify-content:flex-end}
.gm b{font-size:17px;min-width:44px;text-align:center}
.mu{color:var(--mu);font-size:13px}.lk{cursor:pointer;font-weight:600;color:var(--ac)}.bio{white-space:pre-wrap}textarea{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:9px;padding:9px;font:inherit}.em{text-align:center;color:var(--mu);padding:24px 8px}
.pb{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:10px 0;font-weight:700;font-size:14px}
.pb div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:42px}
.msg{background:var(--a2);color:var(--ac);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
ul.rs{margin:6px 0 0;padding-left:18px;font-size:14px}
</style></head>

function stats(){
  const m={};S.teams.forEach(t=>m[t.id]={t,w:0,l:0,d:0,rs:0,ra:0,g:0,res:[]});
  [...S.games].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1).forEach(g=>{
    const h=m[g.home],a=m[g.away];if(!h||!a)return;
    h.rs+=g.hs;h.ra+=g.as;a.rs+=g.as;a.ra+=g.hs;h.g++;a.g++;
    if(g.hs>g.as){h.w++;a.l++;h.res.push(1);a.res.push(0)}
    else if(g.hs<g.as){a.w++;h.l++;h.res.push(0);a.res.push(1)}
    else{h.d++;a.d++;h.res.push(.5);a.res.push(.5)}});
  Object.values(m).forEach(r=>r.pct=r.w+r.l?r.w/(r.w+r.l):0);
  return m}

function strength(r){
  const k=4,pw=r.g/(r.g+k),w=(r.w+.5*r.d+k*.5)/(r.g+k);
  const py=(r.rs+1)**1.83/((r.rs+1)**1.83+(r.ra+1)**1.83);
  const f=r.res.slice(-5),ff=(f.reduce((x,y)=>x+y,0)+1.5)/(f.length+3);
  return .5*w+.35*(py*pw+.5*(1-pw))+.15*ff}

function predict(){
  const m=stats(),A=m[S.pa],B=m[S.pb];
  if(!A||!B||A===B)return null;
  const a=strength(A),b=strength(B);
  let p=(a-a*b)/(a+b-2*a*b);let o=p/(1-p)/1.1;p=o/(1+o);
  const ex=(X,Y)=>X.g&&Y.g?(X.rs/X.g+Y.ra/Y.g)/2:null;
  return{A,B,p,ea:ex(A,B),eb:ex(B,A),n:Math.min(A.g,B.g)}}

function vSt(){
  const m=stats(),rows=Object.values(m).sort((a,b)=>b.pct-a.pct||(b.rs-b.ra)-(a.rs-a.ra)||b.w-a.w);
  if(!rows.length)return`<div class="cd em">아직 등록된 팀이 없어요.${S.admin?" 팀 탭에서 팀을 추가해 주세요.":""}</div>`;
  const L=rows[0];
  return`<div class="cd sc"><table><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>게임차</th><th>득점</th><th>실점</th><th>최근5</th></tr>`+
  rows.map((r,i)=>`<tr><td>${i+1}</td><td>${nm(r.t.id)}</td><td>${r.g}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d}</td><td>${r.w+r.l?f3(r.pct):"-"}</td><td>${i?(((L.w-r.w)+(r.l-L.l))/2).toFixed(1):"-"}</td><td>${r.rs}</td><td>${r.ra}</td><td>${r.res.slice(-5).map(x=>x===1?"승":x===0?"패":"무").join(" ")||"-"}</td></tr>`).join("")+`</table></div>`}

  const form=S.admin?`<div class="cd"><h2>경기 결과 입력</h2><div class="fm"><label>날짜<input type="date" id="gd"></label><label>원정<select id="ga">${opt()}</select></label><label>점수<input type="number" id="gas" min="0" inputmode="numeric"></label><label>홈<select id="gh">${opt()}</select></label><label>점수<input type="number" id="ghs" min="0" inputmode="numeric"></label><button class="bt" data-a="addGame">추가</button></div><p class="mu">같은 날짜로 입력한 경기는 한 매치로 묶여요. 3팀이 서로 한 경기씩이면 3경기를 같은 날짜로 넣어 주세요.</p></div>`:"";

const xpOpts=()=>S.players.filter(p=>(p.team||"")===XF()).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")||'<option value="">선수 없음</option>';
function vTr(){
  const form=S.admin?`<div class="cd"><h2>이적 등록 (영입)</h2><div class="fm"><label>날짜<input type="date" id="xd"></label><label>영입 당하는 팀 (출발)<select id="xf"><option value="" ${XF()===""?"selected":""}>없음 (자유계약)</option>${S.teams.map(t=>`<option value="${t.id}" ${t.id===XF()?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label><label>선수<select id="xp">${xpOpts()}</select></label><label>영입하는 팀 (도착)<select id="xt">${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}<option value="">자유계약(방출)</option></select></label><label>계약금<input type="text" id="xb" style="width:100px"></label><label>계약기간<input type="text" id="xr" style="width:100px"></label><label>주급<input type="text" id="xw" style="width:100px"></label><label>메모<input type="text" id="xn" style="width:170px"></label><button class="bt" data-a="addTr">등록</button></div><p class="mu">영입 당하는 팀에서 선수를 고른 뒤 영입하는 팀을 정해요. 당하는 팀이 없으면 "없음 (자유계약)"을 고르면 자유계약 선수를 데려오는 걸로 기록돼요. 영입 당하는 팀과 영입하는 팀을 같게 고르면 재계약으로 기록돼요. 등록하면 선수의 소속도 함께 바뀌어요.</p></div>`:"";
  const L=[...S.transfers].sort((a,b)=>(b.date||"")<(a.date||"")?-1:1);
  return form+`<div class="cd"><h2>이적 기록</h2>`+(L.length?L.map(x=>S.edit==="x"+x.id?editTr(x):`<div class="gm"><span class="d">${esc((x.date||"").slice(2))}</span><span class="t" style="flex-wrap:wrap"><div style="flex:1;min-width:0"><div><b style="font-size:15px">${esc(x.pname)}</b>${x.note?` <span class="mu">${esc(x.note)}</span>`:""}</div>${mv2(x)}${ctr3(x)}</div></span>${S.admin?`<button class="bt g s" data-a="editTr" data-i="${x.id}">수정</button> <button class="bt r s" data-a="delTr" data-i="${x.id}">${S.del===x.id?"정말 취소?":"이적 취소"}</button>`:""}</div>`).join(""):`<div class="em">아직 이적 기록이 없어요.</div>`)+`</div>`}

function pOpts(ids,sel){return'<option value="">선택</option>'+S.players.filter(p=>ids.includes(p.team)).map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)} (${esc(tm(p.team)?tm(p.team).name:"")})</option>`).join("")}
function matchList(){
  const ds=[...new Set(S.games.map(g=>g.date||""))].sort().reverse();
  if(!ds.length)return`<div class="cd em">등록된 경기가 없어요.</div>`;
  const pn=id=>{const p=S.players.find(x=>x.id===id);return p?`<span class="lk" data-a="viewPl" data-i="${p.id}">${esc(p.name)}</span>`:"-"};
  return ds.map(d=>{
    const gs=S.games.filter(g=>(g.date||"")===d),ts=[...new Set(gs.flatMap(g=>[g.away,g.home]))];
    const row=g=>`<div class="gm" style="flex-wrap:wrap"><span class="t">${nm(g.away)}</span><b>${g.as} : ${g.hs}</b><span class="t h">${nm(g.home)}</span>${S.admin?`<button class="bt r s" data-a="delGame" data-i="${g.id}">${S.del===g.id?"정말?":"삭제"}</button>`:""}<div class="mu" style="flex-basis:100%">⭐ 경기 MVP: <strong>${g.mvp?pn(g.mvp):"-"}</strong>${S.admin?` <select id="mv_${g.id}">${pOpts([g.away,g.home],g.mvp)}</select> <button class="bt g s" data-a="saveMvp" data-i="${g.id}">MVP 저장</button>`:""}</div></div>`;
    
    return`<div class="cd"><h2>매치 ${esc(d)} · ${ts.length}팀 ${gs.length}경기</h2>${gs.map(row).join("")}</div>`}).join("")}

function render(){
  let b;
  if(!S.ready)b=`<div class="cd em">${S.slow?"데이터에 아직 연결되지 않았어요. 잠시 후 다시 시도해 주세요.":"불러오는 중…"}</div>`;
  else if(!S.db)b=`<div class="cd em">로그인한 상태에서 열어야 리그 데이터를 볼 수 있어요.</div>`;
  else b={st:vSt,gm:vGm,tm:vTm,pl:vPl,tr:vTr,ai:vAi}[S.tab]();
  $("app").innerHTML=head()+b;sync()}
function sync(){const p=$("pp");if(!p)return;document.querySelectorAll(".bat").forEach(x=>x.style.display=p.value==="타자"?"":"none");document.querySelectorAll(".pit").forEach(x=>x.style.display=p.value==="투수"?"":"none")}

const val=i=>$(i).value,num=i=>+$(i).value||0;
async function logo(i){const f=$(i)&&$(i).files[0];if(!f)return null;if(!S.assets)throw Error("로고 업로드 권한이 없어요.");if(!f.type.startsWith("image/"))throw Error("이미지 파일만 가능해요.");return (await S.assets.upload(f)).url}
function twice(id){if(S.del===id){S.del=null;return true}S.del=id;render();return false}

async function act(a,i){
  S.msg="";
  try{
    if(a==="tab"){S.tab=i;S.edit=null;S.del=null;S.view=null;S.tv=null}
    else if(a==="sort")S.sort=i;
    else if(a==="pv"){S.pv=i;S.sort=i==="b"?"avg":"era"}
    else if(a==="cancel")S.edit=null;
    else if(a==="viewTm"){S.tab="tm";S.tv=i;S.view=null;S.edit=null;S.del=null}
    else if(a==="backTm")S.tv=null;
    else if(a==="viewPl"){S.tab="pl";S.view=i;S.tv=null;S.del=null;S.edit=S.admin?"p"+i:null}
    else if(a==="back"){S.view=null;S.edit=null}
    else if(a==="editTeam")S.edit="t"+i;
    else if(a==="editPl")S.edit="p"+i;
    else if(a==="predict"){S.pa=val("pa");S.pb=val("pb");S.pred=predict();if(!S.pred)S.msg="서로 다른 두 팀을 골라 주세요."}
    else if(!S.admin)return;
    else if(a==="addTeam"){const n=val("tn").trim();if(!n)throw Error("팀 이름을 입력해 주세요.");const u=await logo("tl");await S.db.collection("teams").add({name:n,logo:u||""})}
    else if(a==="saveTeam"){const n=val("en").trim();if(!n)throw Error("팀 이름을 입력해 주세요.");const u=await logo("el"),d={name:n};if(u)d.logo=u;await S.db.doc("teams/"+i).update(d);S.edit=null}
    else if(a==="delTeam"){if(!twice(i))return;await S.db.doc("teams/"+i).delete()}
    else if(a==="addGame"){const d={date:val("gd"),away:val("ga"),home:val("gh"),as:num("gas"),hs:num("ghs")};if(!d.date||!d.away||!d.home||d.away===d.home)throw Error("날짜와 서로 다른 두 팀을 입력해 주세요.");if(!$("gas").value||!$("ghs").value)throw Error("점수를 입력해 주세요.");await S.db.collection("games").add(d)}
    else if(a==="delGame"){if(!twice(i))return;await S.db.doc("games/"+i).delete()}
    else if(a==="savePl"){const n=val("pn").trim();if(!n)throw Error("이름을 입력해 주세요.");const d={team:val("pt"),lv:+val("plv")||1,name:n,pa:num("pa"),h:num("h"),hr:num("hr"),rbi:num("rbi"),bb:num("bb"),ip:num("ip"),er:num("er"),so:num("so"),bf:num("bf"),ha:num("ha"),pbb:num("pbb")};if(d.h+d.bb>d.pa)throw Error("안타와 볼넷의 합은 타석보다 클 수 없어요.");if(d.ha+d.pbb>d.bf)throw Error("피안타와 볼넷 허용의 합은 상대 타자 수보다 클 수 없어요.");i?await S.db.doc("players/"+i).update(d):await S.db.collection("players").add(d);S.edit=S.view?"p"+S.view:null;S.msg="저장했어요."}
    else if(a==="delPl"){if(!twice(i))return;await S.db.doc("players/"+i).delete()}
    else if(a==="toggleLv"){const p=S.players.find(x=>x.id===i);await S.db.doc("players/"+i).update({lv:p&&p.lv===2?1:2})}
    else if(a==="editTr")S.edit="x"+i;
    else if(a==="saveTr"){const x=S.transfers.find(t=>t.id===i);if(!x)return;const f=val("ef"),to=val("et");if(!f&&!to)throw Error("자유계약 선수를 자유계약으로 보낼 수는 없어요.");await S.db.doc("transfers/"+i).update({date:val("ed")||x.date||"",from:f,to,bonus:val("eb").trim(),period:val("er").trim(),wage:val("ew").trim(),note:val("em2").trim()});const p=S.players.find(q=>q.id===x.pid);if(p&&(p.team||"")===(x.to||"")&&to!==(x.to||""))await S.db.doc("players/"+p.id).update({team:to});S.edit=null;S.msg="이적 기록을 수정했어요."}
    else if(a==="saveBio"){await S.db.doc("players/"+i).update({bio:val("bio").trim()});S.msg="설명을 저장했어요."}
    else if(a==="addTr"){const p=S.players.find(x=>x.id===val("xp")),to=val("xt");if(!p)throw Error("선수를 골라 주세요.");const fr=val("xf");if(fr===to&&!fr)throw Error("자유계약 선수를 자유계약으로 보낼 수는 없어요.");await S.db.collection("transfers").add({date:val("xd")||new Date().toISOString().slice(0,10),pid:p.id,pname:p.name,from:fr,to,note:val("xn").trim(),bonus:val("xb").trim(),period:val("xr").trim(),wage:val("xw").trim()});await S.db.doc("players/"+p.id).update({team:to});S.xf=to;S.msg=fr===to?p.name+" 선수가 "+(tm(to)?tm(to).name:"")+"와(과) 재계약했어요.":p.name+" 선수를 "+(fr?(tm(fr)?tm(fr).name:"원소속"):"자유계약")+"에서 "+(to?(tm(to)?tm(to).name:"새 팀"):"자유계약")+"(으)로 이적시켰어요."}
    else if(a==="delTr"){if(!twice(i))return;const x=S.transfers.find(t=>t.id===i),p=x&&S.players.find(q=>q.id===x.pid);let back=false;await S.db.doc("transfers/"+i).delete();if(p&&(p.team||"")===(x.to||"")){await S.db.doc("players/"+p.id).update({team:x.from||""});back=true}S.msg=back?"이적을 취소하고 선수를 원래 소속으로 되돌렸어요.":"이적 기록을 삭제했어요. 이후 이적이 있어 선수 소속은 그대로예요."}
    else if(a==="saveMvp"){await S.db.doc("games/"+i).update({mvp:val("mv_"+i)||""});S.msg="MVP를 저장했어요."}
    
  }catch(e){S.msg=(e.code?"["+e.code+"] ":"")+(e.message||"저장하지 못했어요.")}
  render()}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset.i)});
document.addEventListener("change",e=>{
  if(e.target.id==="pf"){S.pf=e.target.value;render()}
  if(e.target.id==="pp")sync();
  if(e.target.id==="lf"){S.lf=e.target.value;render()}
  if(e.target.id==="xf"){S.xf=e.target.value;$("xp").innerHTML=xpOpts()}
  if(S.tab==="ai"&&e.target.id==="pa")S.pa=e.target.value;
  if(S.tab==="ai"&&e.target.id==="pb")S.pb=e.target.value});

function init(){const D=window.__SNAP;["teams","players","games","transfers","matches"].forEach(k=>S[k]=D[k]||[]);S.admin=false;S.db=true;S.ready=true;if(!tm(S.pa))S.pa=S.teams[0]?S.teams[0].id:"";if(!tm(S.pb))S.pb=S.teams[1]?S.teams[1].id:(S.teams[0]?S.teams[0].id:"");render()}
init();
</script></body></html>
